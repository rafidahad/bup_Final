# One command runs everything:  docker compose up -d --build
# Simulator (official, unchanged) + Fuel Operations app + Prometheus + Grafana.
# Ports bind to 127.0.0.1 only. Copy .env.example to .env to change settings.
services:
  simulator-api:
    image: asifmahmoud414/bup-fuel-supply-simulator:1.0.0
    environment:
      SIMULATION_SPEED: ${SIMULATION_SPEED:-8}
      TICK_MINUTES: ${TICK_MINUTES:-15}
      SIMULATOR_START_MODE: ${SIMULATOR_START_MODE:-paused}
    ports:
      # Host port is configurable: Windows/Hyper-V often reserves 8000.
      - "127.0.0.1:${SIM_PORT:-18000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/v1/health', timeout=3).status == 200 else 1)"]
      interval: 5s
      timeout: 4s
      retries: 10

  # Extra simulators for the parallel benchmark only (`--profile bench`); never started by default.
  sim-b: &bench-sim
    image: asifmahmoud414/bup-fuel-supply-simulator:1.0.0
    profiles: ["bench"]
    environment:
      TICK_MINUTES: ${TICK_MINUTES:-15}
      SIMULATOR_START_MODE: paused
  sim-c: *bench-sim
  sim-d: *bench-sim

  fuelops:
    build: .
    image: fuelops:${FUELOPS_VERSION:-dev}
    environment:
      SIM_URL: http://simulator-api:8000
      FUELOPS_POLICY: ${FUELOPS_POLICY:-lp-buffer}
      FUELOPS_MODE: ${FUELOPS_MODE:-manual}
      FUELOPS_OPERATOR_TOKEN: ${FUELOPS_OPERATOR_TOKEN:-}
      FORECAST_ENABLED: ${FORECAST_ENABLED:-true}
      FORECAST_URL: http://forecaster:8200
      SUMMARIES_ENABLED: ${SUMMARIES_ENABLED:-true}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
    ports:
      - "127.0.0.1:${APP_PORT:-8100}:8100"
    volumes:
      - fuelops-data:/app/data
    depends_on:
      simulator-api:
        condition: service_healthy
    restart: unless-stopped

  forecaster:
    # Chronos-2-Small (pretrained, CPU). First start downloads the pinned weights into the models volume.
    build: ./forecaster
    image: fuelops-forecaster:${FUELOPS_VERSION:-dev}
    volumes:
      - models:/models
    ports:
      - "127.0.0.1:${FORECAST_PORT:-8200}:8200"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    volumes:
      - ./ops/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      - fuelops
    restart: unless-stopped

  grafana:
    image: grafana/grafana-oss:12.1.1
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/fuelops.json
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3300}
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/etc/grafana/dashboards:ro
    ports:
      # Host port 3300, not 3000: Dokploy's own panel uses 3000.
      - "127.0.0.1:${GRAFANA_PORT:-3300}:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  fuelops-data:
  models:
