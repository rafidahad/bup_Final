# Source → Build → Test → Package → Deploy → Health check → Running application (PS §12)
name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Unit tests (optimizer correctness fixtures)
        run: python -m pytest -q tests
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build web app (type-check + bundle)
        working-directory: web
        run: npm ci && npm run build

  deploy-smoke:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package and deploy the full stack
        run: docker compose up -d --build
      - name: Health check
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8100/api/health > health.json; then break; fi
            sleep 2
          done
          cat health.json
          python3 -c "import json; h=json.load(open('health.json')); c=h['components']; assert all(c[k]['status']=='healthy' for k in ('backend_api','database','simulator')), h"
      - name: Running application answers with live data
        run: |
          curl -fsS -X POST http://localhost:8100/api/lab/control -H 'Content-Type: application/json' -d '{"action":"step"}'
          sleep 3
          curl -fsS http://localhost:8100/api/status | tee status.json
          python3 -c "import json; s=json.load(open('status.json')); assert s['tick'] is not None and s['tick'] >= 1, s"
          curl -fsS http://localhost:8100/metrics | grep -q fuelops_decision_cycles_total
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Tear down
        if: always()
        run: docker compose down -v
